<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <title>Fintrack</title>
    <!-- Resolves the theme before first paint so the page never flashes the
         wrong palette. [data-theme] always holds the resolved theme (a stored
         pin, else the OS preference). Mirrors applyTheme() in
         src/hooks/useTheme.js. -->
    <script>
      (function () {
        var m = null;
        try {
          m = localStorage.getItem('fintrack.theme');
        } catch (e) {}
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = m;
      })();
    </script>
    <link rel="preload" href="/fonts/InterVar.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
